# Автономная работа Sol внутри собственного дерева без запросов разрешения.
approval_policy = "never"
sandbox_mode = "workspace-write"
allow_login_shell = false

[sandbox_workspace_write]
# Доступ в сеть открыт по слову Кожаного босса 4 сентября 2026. До этого дня
# Sol не мог отправить собственные коммиты: имя github.com не разрешалось, и
# отказ выглядел как неисправность DNS, хотя сети не было по решению.
network_access = true
# Песочница workspace-write держит каталоги .git только для чтения, и на этом
# спотыкается git commit. Sol фиксирует изменения в собственном дереве, поэтому
# записываемым открыт ровно один .git — его. Чужие деревья остаются недоступны.
# /data/tmp и ~/claudetmp — временное роли (слово человека 24 сентября 2026): крупное в
# /data/tmp/rpg-*, мелкое в ~/claudetmp/rpg-*, убирает сама роль помощником
# claude/tools/tmp-clean.sh. /tmp песочница открывает и так.
writable_roots = [
    "/home/alex/kolkhoz/rpg/.git",
    "/home/alex/kolkhoz/claude/mailbox",
    "/data/tmp",
    # Озвучка (слово человека 24 сентября 2026: «озвучку будет делать агент rpg»): показ дублей человеку —
    # /data/kolkhoz/voice, то же место в конвейере, что /data/kolkhoz/sound у звука. Бекапа у /data нет:
    # ПРИНЯТЫЙ дубль живёт в дереве rpg (git), здесь — только прослушивание.
    "/data/kolkhoz/voice",
    "/home/alex/claudetmp",
]

[apps._default]
default_tools_approval_mode = "auto"
destructive_enabled = false
open_world_enabled = false
