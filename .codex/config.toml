# Автономная работа Sol внутри собственного дерева без запросов разрешения.
approval_policy = "never"
sandbox_mode = "workspace-write"
allow_login_shell = false

[sandbox_workspace_write]
# Доступ в сеть открыт по слову Кожаного босса 4 сентября 2026. До этого дня
# Sol не мог отправить собственные коммиты: имя github.com не разрешалось, и
# отказ выглядел как неисправность DNS, хотя сети не было по решению.
network_access = true
# Песочница workspace-write держит каталоги .git только для чтения, и на этом
# спотыкается git commit. Sol фиксирует изменения в собственном дереве, поэтому
# записываемым открыт ровно один .git — его. Чужие деревья остаются недоступны.
writable_roots = ["/home/alex/kolkhoz/rpg/.git", "/home/alex/kolkhoz/claude/mailbox"]

[apps._default]
default_tools_approval_mode = "auto"
destructive_enabled = false
open_world_enabled = false
